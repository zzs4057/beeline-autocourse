name: Feature request
description: Suggest a compliant navigation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The project does not accept requests for visibility spoofing, progress fabrication, or anti-cheat bypasses.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What course-page navigation problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized DOM or screenshots
